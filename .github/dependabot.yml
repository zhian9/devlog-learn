version: 2

updates:
  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, go]
    open-pull-requests-limit: 10
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /cli/web
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, frontend]
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
